<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Memory Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  </head>

  <body>
    <h1 class="game-title">Pokémon Memory</h1>

    <div class="control-bar">
      <select id="diff">
        <option value="easy">Easy (3/90s)</option>
        <option value="medium">Medium (4/60s)</option>
        <option value="hard">Hard (5/45s)</option>
      </select>

      <button id="startBtn">Start</button>
      <button id="resetBtn">Restart</button>
      <button id="themeBtn">Dark Mode</button>
      <button id="powerBtn">Power Up</button>
    </div>

    <div class="status">
      Clicks:<span id="clicks">0 </span> | Pairs: <span id="matched">0</span> /
      <span id="total">0</span> | Time: <span id="time">60 </span>s
    </div>

    <div id="game_grid"></div>

    <div id="modal" class="modal hidden">
      <div class="modal-box">
        <h2 id="msg"></h2>
        <button id="closeModal">OK</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
